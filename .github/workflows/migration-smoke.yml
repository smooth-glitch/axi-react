name: Migration smoke test

# Run manually after moving the repo: checks secrets, runner and repo-name
# independence, and posts a test card to Teams. Changes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, axi-vm]
    steps:
      - uses: actions/checkout@v4
      - name: Where am I
        run: |
          . scripts/repo-env.sh
          echo "REPO=$REPO  SERVER=$SERVER  DEFAULT_BRANCH=$DEFAULT_BRANCH"
          echo "runner: $RUNNER_NAME  workspace: $GITHUB_WORKSPACE"
      - name: Secrets present
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          ok=1
          [ -n "$TEAMS_WEBHOOK_URL" ] || { echo "::error::TEAMS_WEBHOOK_URL missing"; ok=0; }
          [ -n "$REDIS_PASSWORD" ] || { echo "::error::REDIS_PASSWORD missing"; ok=0; }
          [ $ok = 1 ]
      - name: Stable service path
        run: |
          ls -ld /opt/axi/current
          systemctl is-active axi-chat-backend
          grep -q '/opt/axi/current/' /etc/systemd/system/axi-chat-backend.service
      - name: Tools on the runner
        run: |
          for t in git curl jq npm node redis-cli; do command -v $t >/dev/null && echo "ok $t" || { echo "::error::$t missing"; exit 1; }; done
      - name: Post a test card to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          . scripts/repo-env.sh
          curl -fsS -X POST -H 'Content-Type: application/json' "$TEAMS_WEBHOOK_URL" \
            -d "{\"type\":\"message\",\"attachments\":[{\"contentType\":\"application/vnd.microsoft.card.adaptive\",\"content\":{\"type\":\"AdaptiveCard\",\"version\":\"1.4\",\"body\":[{\"type\":\"TextBlock\",\"weight\":\"Bolder\",\"text\":\"Migration smoke test passed\"},{\"type\":\"TextBlock\",\"wrap\":true,\"text\":\"Repo $REPO is wired to the runner and webhook.\"}]}}]}" >/dev/null
          echo "card posted"
