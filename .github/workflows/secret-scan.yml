name: Secret scan

# Fails a PR if one of its commits contains something that looks like a secret (API keys,
# tokens, private keys, webhook URLs...). Scans only the PR's own commits, so old history
# does not turn every PR red. If it flags a false positive, add the finding's fingerprint to
# a .gitleaksignore file at the repo root.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
