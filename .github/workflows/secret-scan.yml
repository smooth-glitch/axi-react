name: Secret scan

# Fails a PR if one of its commits contains something that looks like a secret (API keys, tokens, private keys, webhook
# URLs...). Scans only the PR's own commits, so old history does not turn every PR red.
# Uses the open-source gitleaks command-line tool (pinned version, checksum verified), NOT the gitleaks GitHub Action:
# that action needs a paid licence key for repositories owned by an organisation, which would break this check after a
# move to a company account.
# If it flags a false positive, add the finding's fingerprint to a .gitleaksignore file at the repo root.
on:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | sed 's/gitleaks_.*/gitleaks.tgz/' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version

      - name: Scan the commits of this pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          ./gitleaks detect --source . --log-opts "${BASE}..${HEAD}" --redact --no-banner --verbose --exit-code 1
