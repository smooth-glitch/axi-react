name: Deploy frontend

# Same self-hosted-runner architecture as deploy-backend.yml -- see that
# file's comment for why (GitHub's cloud runners can't reach the
# office-network-only deploy VM at all). Builds the React app and copies
# the static output to /var/www/axi-react, which nginx serves at "/" on
# the VM (see axi-chat-backend's nginx config -- /ws, /upload, and
# /uploads/ are routed to the Erlang backend; everything else is this
# static build).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "shared/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: [self-hosted, axi-vm]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy static files
        run: |
          rsync -a --delete dist/ /var/www/axi-react/
          sudo restorecon -R /var/www/axi-react

      - name: Verify it actually came back up
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/)
          echo "nginx served the frontend with HTTP $code"
          test "$code" = "200"
