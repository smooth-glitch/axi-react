name: Deploy frontend

# Same self-hosted-runner architecture as deploy-backend.yml -- see that
# file's comment for why (GitHub's cloud runners can't reach the
# office-network-only deploy VM at all). Builds the React app and copies
# the static output to /var/www/axi-react, which nginx serves at "/" on
# the VM (see axi-chat-backend's nginx config -- /ws, /upload, and
# /uploads/ are routed to the Erlang backend; everything else is this
# static build).
on:
  workflow_dispatch:   # lets you press "Run workflow" to redeploy main by hand
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "shared/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    # Production only ever runs main, including when started by hand from the Actions tab.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, axi-vm]
    steps:
      # clean: false -- this runner's workspace is shared with the backend deploy
      # (deploy-backend.yml builds axi-chat-backend/_build here and the service loads
      # its modules from it). The default checkout runs `git clean -ffdx`, which
      # deletes that ignored build directory; the backend then crashed with `undef`
      # the first time it needed a module it had not loaded yet (e.g. on login).
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy static files
        run: |
          rsync -a --delete dist/ /var/www/axi-react/
          sudo restorecon -R /var/www/axi-react

      - name: Verify it actually came back up
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/)
          echo "nginx served the frontend with HTTP $code"
          test "$code" = "200"
