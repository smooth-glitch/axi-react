name: Deploy backend

# Runs on the self-hosted runner installed directly on the deploy VM
# (10.0.2.146, office-network-only) -- GitHub's own cloud-hosted runners
# cannot reach that VM at all, since it's not internet-reachable. The
# runner itself makes an outbound connection to GitHub (always works, no
# inbound firewall changes needed), so this is the correct architecture
# for deploying to a private-network target, not a workaround.
on:
  workflow_dispatch:   # lets you press "Run workflow" to redeploy main by hand
  push:
    branches: [main]
    paths:
      - "axi-chat-backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    # Production only ever runs main, including when started by hand from the Actions tab.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, axi-vm]
    steps:
      - uses: actions/checkout@v4

      # SELinux (Oracle Linux, enforcing) blocks executing binaries out of
      # a user's home directory by default -- see axi-chat-backend's own
      # setup notes. The VM has a persistent fcontext rule for this
      # checkout path, but restorecon still needs to run after every fresh
      # checkout to actually apply it to the newly-written files.
      - name: Fix SELinux context on the fresh checkout
        run: sudo restorecon -R "$GITHUB_WORKSPACE"

      - name: Build
        working-directory: axi-chat-backend
        run: |
          export PATH=/opt/erlang/27.3.4.18/bin:$PATH
          chmod +x tools/rebar3
          ./tools/rebar3 compile

      # The service runs from the stable path /opt/axi/current (WorkingDirectory in axi-chat-backend.service), NOT from the
      # runner's workspace folder, whose name follows the repository's name. So moving or renaming the repository needs
      # no edit on the VM: the first deploy from the new repository re-points this link at its checkout.
      - name: Point the stable path /opt/axi/current at this checkout
        run: |
          sudo mkdir -p /opt/axi
          sudo ln -sfn "$GITHUB_WORKSPACE" /opt/axi/current
          echo "/opt/axi/current -> $(readlink /opt/axi/current)"

      - name: Restart the service
        run: sudo systemctl restart axi-chat-backend

      - name: Verify it actually came back up
        run: |
          sleep 3
          sudo systemctl is-active axi-chat-backend
          # Hit the backend directly on its own port, not through nginx's
          # "/" -- that now serves the React frontend build (see
          # deploy-frontend.yml), so a 200 there says nothing about the
          # backend's health. 404 direct-to-backend is the expected
          # response (no page-serving by design); anything else (502,
          # connection refused) means the restart didn't actually bring a
          # healthy backend up.
          # Note: TLS termination is at nginx (see nginx/setup-tls.sh);
          # the backend itself always listens on plain HTTP/WS on 8080.
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/)
          echo "backend responded with HTTP $code"
          test "$code" = "404"
