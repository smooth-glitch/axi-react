name: Cleanup preview

# Tears down the isolated preview environment preview-deploy.yml created
# for this PR's branch -- stops its backend instance, removes its nginx
# routing and static files, flushes its Redis DB, and frees its slot for
# reuse. Runs whether the PR was merged or just closed/abandoned.
on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: [self-hosted, axi-vm]
    steps:
      - name: Tear down this branch's preview slot
        run: |
          RAW="${{ github.head_ref }}"
          SLUG=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g' | cut -c1-30)
          /opt/preview/teardown-slot.sh "$SLUG"
