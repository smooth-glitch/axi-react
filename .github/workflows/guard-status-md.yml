name: Guard generated STATUS.md

# docs/STATUS.md is regenerated by a bot after every merge to main. A hand edit
# would be overwritten and can cause merge conflicts, so PRs may not change it.
on:
  pull_request:
    paths: ['docs/STATUS.md']

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Explain and fail
        run: |
          echo "::error file=docs/STATUS.md::docs/STATUS.md is generated by .github/workflows/update-status.yml (scripts/gen-status.sh). Do not edit it by hand: revert your change to this file. To fix a merge conflict in it, run: git checkout origin/main -- docs/STATUS.md"
          exit 1
