name: Update status page

# Regenerates docs/STATUS.md (the page the pinned Teams message links to)
# whenever something lands on main. The commit is pushed with GITHUB_TOKEN,
# which does not trigger other workflows, so there is no loop.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/STATUS.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate docs/STATUS.md
        run: bash scripts/gen-status.sh
      - name: Commit if changed
        run: |
          git config user.name "connectum-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/STATUS.md
          if git diff --cached --quiet; then echo "STATUS.md is unchanged"; exit 0; fi
          git commit -m "docs: refresh STATUS.md [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          # If the branch is protected (e.g. "require a pull request"), the push is refused. That must not turn every merge
          # red: warn instead. To keep the page updating, let the github-actions bot bypass the protection for this branch.
          if ! git push; then
            echo "::warning title=STATUS.md was not updated::The push to ${GITHUB_REF_NAME} was refused (branch protection?). Allow the github-actions bot to bypass it, or ignore this: nothing else depends on the page."
          fi
